name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Manifest generator tests
        run: python tests/test_generator.py
      - name: Cluster config tests
        run: python tests/test_cluster_config.py
      - name: Cluster platform tests (offline)
        run: python tests/test_cluster_platforms.py
      - name: Application template tests
        run: python tests/test_app_templates.py
      - name: Networking & Storage add-on tests
        run: python tests/test_addons.py
      - name: Hover-help coverage
        run: python tests/test_field_docs.py
      - name: Flask API tests
        run: python tests/test_web.py

  e2e:
    name: Browser end-to-end (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Browser end-to-end test
        # ubuntu-latest ships Google Chrome; the test drives it through Playwright
        run: CHROME="$(command -v google-chrome)" python tests/web_e2e_test.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t k8s-manifest-web:ci .
      - name: Smoke test
        run: |
          docker run -d --name web -p 127.0.0.1:8080:8080 k8s-manifest-web:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -H 'Content-Type: application/json' -d '{"kind":"Deployment","values":{"name":"web"}}' \
            http://127.0.0.1:8080/api/generate | grep -q '"ok":true'
          docker rm -f web
